name: Test

on:
  workflow_call:
    inputs:
      version:
        description: halfcraft's version (tools/build/version.py)
        required: true
        type: string

permissions:
  contents: read

jobs:
  core:
    name: Portable C++ regression tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Budget, fairness and excavation (ASan + UBSan)
        shell: bash
        run: |
          set -euo pipefail
          for test in stream_budget excavation; do
            g++ -std=c++17 -Wall -Wextra -Werror -fsanitize=address,undefined -g -Isource/src "tools/tests/${test}_test.cpp" -o "$RUNNER_TEMP/${test}_test"
            "$RUNNER_TEMP/${test}_test"
          done

  minecraft:
    name: Minecraft mod
    runs-on: windows-2025
    timeout-minutes: 45
    env:
      HALFCRAFT_VERSION: ${{ inputs.version }}
      GRADLE_OPTS: -Dorg.gradle.daemon=false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13.15"
      - name: JDK 25
        run: python .github/scripts/pinned.py jdk
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Build and test
        uses: ./.github/actions/gradle
        with:
          tasks: build
      - name: Test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: minecraft-reports
          path: minecraft/build/reports
          retention-days: 7
