name: Build failure diagnostics
on:
  push:
    branches: [arena/61fd8987-halfcraft]
permissions:
  actions: read
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Read failed Minecraft build log
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/${{ github.repository }}/actions/jobs/122698243111/logs > mc-build.log 2>&1 || true
          python - <<'PY'
          import base64
          from pathlib import Path
          text = '\n'.join(Path('mc-build.log').read_text(errors='replace').splitlines()[-180:])
          encoded = base64.b64encode(text.encode()).decode()
          for i in range(0, len(encoded), 3000):
              print(f'::warning title=mc-build-log-{i // 3000:04d}::{encoded[i:i+3000]}')
          PY
