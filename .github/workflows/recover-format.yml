name: Recover formatter diagnostics
on:
  push:
    branches: [arena/61fd8987-halfcraft]
permissions:
  actions: read
  contents: read
jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: java-format-patch
          run-id: 40649496637
          github-token: ${{ github.token }}
      - name: Formatter patch annotations
        run: |
          python -c 'import base64; from pathlib import Path; s=base64.b64encode(Path("java-format.patch").read_bytes()).decode(); [print(f"::warning title=java-format-patch-{i // 3000:04d}::{s[i:i+3000]}") for i in range(0, len(s), 3000)]'
