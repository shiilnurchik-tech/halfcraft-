name: Lint

on:
  workflow_call:

permissions:
  contents: read

jobs:
  format:
    name: C++ and Python formatting
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13.15"
      - name: protocol files
        run: python tools/build/protocol.py --check
      - name: clang-format 22.1.3
        run: python .github/scripts/pinned.py clang-format
      - name: ruff 0.16.9
        run: python .github/scripts/pinned.py ruff
      - name: make lint
        run: python tools/lint/format.py --check

  spotless:
    name: Java formatting
    runs-on: windows-2025
    timeout-minutes: 20
    env:
      GRADLE_OPTS: -Dorg.gradle.daemon=false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13.15"
      - name: JDK 25
        run: python .github/scripts/pinned.py jdk
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: spotlessCheck
        uses: ./.github/actions/gradle
        with:
          tasks: spotlessCheck
      - name: Apply formatting for diagnostics
        if: failure()
        uses: ./.github/actions/gradle
        with:
          tasks: spotlessApply
      - name: Prepare formatting patch
        if: failure()
        shell: bash
        run: |
          git diff --binary > java-format.patch
          # Also expose the small patch through check annotations: restricted clients may not
          # be able to download artifacts from GitHub's separate blob-storage host.
          python -c 'import base64; from pathlib import Path; s=base64.b64encode(Path("java-format.patch").read_bytes()).decode(); [print(f"::warning title=java-format-patch-{i // 3000:04d}::{s[i:i+3000]}") for i in range(0, len(s), 3000)]'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: java-format-patch
          path: java-format.patch
          if-no-files-found: ignore
          retention-days: 7
