name: Horizon experimental adapter

on:
  push:
    paths:
      - 'horizon/**'
      - 'protocol/schema/**'
      - 'tools/build/horizon_protocol.py'
      - 'tools/halfcraft/protocol.py'
      - '.github/workflows/horizon.yml'
  pull_request:
    paths:
      - 'horizon/**'
      - 'protocol/schema/**'
      - 'tools/build/horizon_protocol.py'
      - 'tools/halfcraft/protocol.py'
      - '.github/workflows/horizon.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  bridge:
    name: Bridge (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Check schema parity
        run: python tools/build/horizon_protocol.py --check
      - name: Rust toolchain
        run: rustup update stable --no-self-update
      - name: Regression tests (no Horizon or game needed)
        run: cargo +stable test --locked --manifest-path horizon/bridge-tests/Cargo.toml
      - name: Rust formatting
        run: |
          cargo +stable fmt --manifest-path horizon/bridge-tests/Cargo.toml --check
          rustfmt +stable --edition 2024 --check horizon/native/api/src/lib.rs

  native-api:
    name: Pinned Horizon API compile check
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust toolchain
        run: rustup update stable --no-self-update
      - name: Check actual upstream Hooks and Host (not mock interfaces)
        shell: pwsh
        run: |
          & cargo +stable check --manifest-path horizon/native/api/Cargo.toml 2>&1 | Tee-Object -FilePath native-check.log
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            $tail = (Get-Content native-check.log -Tail 100) -join "`n"
            if ($tail.Length -gt 20000) { $tail = $tail.Substring($tail.Length - 20000) }
            for ($i = 0; $i -lt $tail.Length; $i += 2500) {
              $chunk = $tail.Substring($i, [Math]::Min(2500, $tail.Length - $i))
              $chunk = $chunk.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
              Write-Output "::error title=Horizon native check::$chunk"
            }
            exit $code
          }

  previous-native-diagnostic:
    name: Recover initial native compiler diagnostic
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Expose previous failure without external log downloads
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          gh run view 42492234193 --job 128766907909 --log-failed --allow-escape-sequences > /tmp/previous-native.log
          python - <<'PYTHON'
          from pathlib import Path
          text = Path('/tmp/previous-native.log').read_text()[-18000:]
          for start in range(0, len(text), 2400):
              part = text[start:start + 2400].replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print(f'::notice title=Previous native compiler output::{part}')
          PYTHON
